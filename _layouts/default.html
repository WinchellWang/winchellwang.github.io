<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<!-- hack iOS CSS :active style -->
<body ontouchstart="">

    {% include nav.html %}

    {{ content }}

    {% include footer.html %}

    <button id="back-to-top" class="back-to-top">↑</button>

<!-- Image to hack wechat -->
<img src="/img/avatar.png" width="0" height="0" />
<!-- Migrate from head to bottom, no longer block render and still work -->

<script>
    // Back to top button
    var backToTopBtn = document.getElementById('back-to-top');
    if (backToTopBtn) {
        window.addEventListener('scroll', function() {
            if (window.pageYOffset > 200) {
                backToTopBtn.style.display = 'block';
            } else {
                backToTopBtn.style.display = 'none';
            }
        });
        backToTopBtn.addEventListener('click', function() {
            window.scrollTo({top: 0, behavior: 'smooth'});
        });
    }

    // Open every external web link in a new tab. Same-origin links, page
    // anchors, mail links and other non-HTTP actions keep their normal behavior.
    Array.prototype.forEach.call(document.querySelectorAll('a[href]'), function(link) {
        var url;
        try {
            url = new URL(link.getAttribute('href'), window.location.href);
        } catch (error) {
            return;
        }

        if ((url.protocol === 'http:' || url.protocol === 'https:') &&
            url.origin !== window.location.origin) {
            link.setAttribute('target', '_blank');
            link.setAttribute('rel', 'noopener noreferrer');
        }
    });

</script>

<!-- Register Service Worker for PWA -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    // Remove the legacy /js/ scoped worker, which cannot control site pages.
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      registrations.forEach(function(registration) {
        if (/\/js\/$/.test(new URL(registration.scope).pathname)) {
          registration.unregister();
        }
      });
    });

    navigator.serviceWorker.register('{{ "/sw.js" | prepend: site.baseurl }}', { scope: '{{ "/" | prepend: site.baseurl }}' })
      .then(function(registration) {
        console.log('SW registered: ', registration);
      })
      .catch(function(registrationError) {
        console.log('SW registration failed: ', registrationError);
      });
  });
}
</script>

</body>

</html>
