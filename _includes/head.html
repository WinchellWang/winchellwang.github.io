<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="description" content="{{ site.description }}">
    <meta name="keywords"  content="{{ site.keyword }}">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="{{ site.chrome-tab-theme-color }}" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#12171d" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Winchell.Wang">
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/img/apple.png">
    
    <title>{% if page.title %}{{ page.title }} - {{ site.SEOTitle }}{% else %}{{ site.SEOTitle }}{% endif %}</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="{{ site.baseurl }}/img/favicon.ico">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="{{ site.baseurl }}/manifest.json">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <!-- Bootstrap Core CSS -->
    <link rel="stylesheet" href="{{ "/css/bootstrap.min.css" | prepend: site.baseurl }}">

    <!-- Pygments Github CSS -->
    <link rel="stylesheet" href="{{ "/css/syntax.css" | prepend: site.baseurl }}">

    <!-- Font Awesome 6 (the v4 shim preserves the existing fa-* class names) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/v4-shims.min.css" rel="stylesheet" type="text/css">

    <!-- line number for code block -->
    <script src="{{ "/js/prism.js" | prepend: site.baseurl }}"></script>
    <link rel="stylesheet" href="{{ "/css/prism.css" | prepend: site.baseurl }}">

    <!-- Custom CSS (last so theme overrides vendor styles) -->
    <link rel="stylesheet" href="{{ "/css/moax-blog.css" | prepend: site.baseurl }}">
    <script>
        MathJax = {
          tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']]
          },
          chtml: {
            fontURL: 'https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/output/chtml/fonts/woff-v2'
          }
        };
    </script>
    <script src="{{ "/js/polyfill.min.js" | prepend: site.baseurl }}"></script>
    <script id="MathJax-script" async src="{{ "/js/tex-mml-chtml.js" | prepend: site.baseurl }}"></script>

    {% if site.google_analytics %}
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}
</head>
